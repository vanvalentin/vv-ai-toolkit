[project]
name = "offer-intel-mcp"
version = "0.1.0"
description = "Evidence-first job offer intelligence MCP gateway"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=3.4.4",
    "patchright>=1.40.0",
    "pydantic>=2.0",
    "uv",
]

[project.scripts]
offer-intel-mcp = "offer_intel.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
