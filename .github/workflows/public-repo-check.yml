name: Public repository privacy check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan for secrets and private deployment identifiers
        run: python3 scripts/check_public_repo.py
